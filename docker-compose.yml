services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shop}
      POSTGRES_DB: service_shop
    ports:
      - "5432:5432"
    volumes:
      - shop_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d service_shop"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    profiles: ["app"]
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://shop:${POSTGRES_PASSWORD:-shop}@postgres:5432/service_shop
      CATALOG_FILE: /data/products.json
      IMAGE_DIR: /app/public/assets/images
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-service-shop}
      ADMIN_SECRET: ${ADMIN_SECRET:-service-shop-secret}
      AUTH_SECRET: ${AUTH_SECRET:-service-shop-users}
    volumes:
      - shop_images:/app/public/assets/images
      - shop_catalog:/data
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  shop_postgres:
  shop_images:
  shop_catalog:
